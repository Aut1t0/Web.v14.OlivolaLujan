<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa mundial interactivo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <style>
    :root {
      --map-bg: #17221c;
      --map-panel: #1d2b24;
      --country: #455b4c;
      --country-2: #526a58;
      --border: #819789;
      --hover: #bfd0bb;
      --highlight: #e6f0e5;
      --gold: #d6a84f;
      --bone: #f5f2e9;
      --muted: #96a69b;
      --grid: rgba(194, 208, 194, 0.055);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--map-bg);
      color: var(--bone);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
      overflow: hidden;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 50% 48%, rgba(71, 99, 82, .13), transparent 52%),
        var(--map-bg);
      background-size: 32px 32px, 32px 32px, auto, auto;
    }

    .map-shell::before,
    .map-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }

    .map-shell::before {
      inset: 10% 8%;
      border: 1px solid rgba(214, 168, 79, .08);
      border-radius: 14px;
    }

    .map-shell::after {
      inset: 0;
      background: linear-gradient(180deg, rgba(9, 18, 14, .12), rgba(9, 18, 14, .28));
    }

    .map-status {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 8;
      display: grid;
      gap: 4px;
      pointer-events: none;
    }

    .map-status span {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .map-status strong {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(245, 242, 233, .86);
    }

    .map-hint {
      position: absolute;
      right: 20px;
      top: 19px;
      z-index: 8;
      padding: 7px 10px;
      border: 1px solid rgba(245, 242, 233, .09);
      border-radius: 999px;
      background: rgba(16, 30, 24, .72);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .11em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    #worldMap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
    }

    .sphere {
      fill: #203027;
      stroke: rgba(104, 130, 115, .42);
      stroke-width: .8;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.30));
    }

    .graticule {
      fill: none;
      stroke: rgba(150, 166, 155, .07);
      stroke-width: .45;
    }

    .country-path {
      fill: var(--country);
      stroke: var(--border);
      stroke-width: .62;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      outline: none;
      transform-box: fill-box;
      transform-origin: center;
      transition:
        fill 180ms ease,
        stroke 180ms ease,
        stroke-width 180ms ease,
        filter 180ms ease,
        transform 180ms ease;
    }

    .country-path:hover,
    .country-path.active {
      fill: var(--hover);
      stroke: var(--highlight);
      stroke-width: 1.15;
      transform: translate(-1px, -2.5px);
      filter:
        drop-shadow(6px 8px 4px rgba(0,0,0,.62))
        drop-shadow(-2px -2px 2px rgba(235,250,235,.20));
    }

    .country-path:focus-visible {
      stroke: var(--gold);
      stroke-width: 1.35;
    }

    .country-path.selected {
      fill: #b5cdbb;
      stroke: var(--gold);
      stroke-width: 1.35;
    }

    .country-path:not(.supported) { cursor: pointer; }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      background: rgba(11, 20, 16, .94);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .loading.hidden { opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s ease; }

    .country-tooltip {
      position: fixed;
      z-index: 20;
      min-width: 160px;
      max-width: 220px;
      padding: 10px 12px;
      border: 1px solid rgba(214, 168, 79, .40);
      border-radius: 7px;
      background: rgba(16, 30, 24, .96);
      color: var(--bone);
      box-shadow: 0 18px 32px rgba(0,0,0,.32);
      opacity: 0;
      pointer-events: none;
      transform: translate(12px, 12px);
      transition: opacity .14s ease;
      backdrop-filter: blur(12px);
    }

    .country-tooltip.show { opacity: 1; }
    .country-tooltip strong { display: block; font: 400 17px/1.1 Georgia, serif; }
    .country-tooltip small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }

    @media (max-width: 700px) {
      .map-shell { min-height: 320px; }
      .map-status { top: 14px; left: 14px; }
      .map-hint { display: none; }
      .country-tooltip { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .country-path, .country-tooltip, .loading { transition: none; }
      .country-path:hover, .country-path.active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="map-shell" id="mapShell">
    <div class="map-status">
      <span>Mapa mundial</span>
      <strong id="mapStatus">Seleccioná un país</strong>
    </div>
    <div class="map-hint">Tocá un país · cambia la hora web</div>
    <svg id="worldMap" role="img" aria-label="Mapa mundial interactivo"></svg>
    <div class="loading" id="loading">Cargando mapa…</div>
    <div class="country-tooltip" id="countryTooltip" aria-hidden="true">
      <strong id="tooltipName">País</strong>
      <small id="tooltipHint">Click para seleccionar</small>
    </div>
  </div>

  <script>
    (() => {
      const svg = d3.select('#worldMap');
      const loading = document.getElementById('loading');
      const mapShell = document.getElementById('mapShell');
      const tooltip = document.getElementById('countryTooltip');
      const tooltipName = document.getElementById('tooltipName');
      const mapStatus = document.getElementById('mapStatus');

      const metadataByNumericId = new Map();
      let selectedPath = null;
      let countries = [];
      let projection = d3.geoNaturalEarth1();
      let path = d3.geoPath(projection);

      const fallbackNames = {
        '032': 'Argentina', '076': 'Brasil', '152': 'Chile', '604': 'Perú', '858': 'Uruguay',
        '600': 'Paraguay', '068': 'Bolivia', '170': 'Colombia', '862': 'Venezuela',
        '484': 'México', '724': 'España', '250': 'Francia', '276': 'Alemania', '380': 'Italia',
        '826': 'Reino Unido', '392': 'Japón', '410': 'Corea del Sur', '156': 'China',
        '036': 'Australia', '124': 'Canadá', '840': 'Estados Unidos'
      };

      function parseUtcOffset(value) {
        const match = String(value || '').match(/^UTC([+-])(\d{2}):?(\d{2})?$/i);
        if (!match) return null;
        const sign = match[1] === '-' ? -1 : 1;
        const hours = Number(match[2] || 0);
        const minutes = Number(match[3] || 0);
        return sign * (hours * 60 + minutes);
      }

      function getReferenceOffset(timezones) {
        if (!Array.isArray(timezones) || !timezones.length) return -180;
        const parsed = timezones.map(parseUtcOffset).filter(v => Number.isFinite(v));
        if (!parsed.length) return -180;
        // Use the first published country timezone as the reference zone.
        return parsed[0];
      }

      // Local language fallbacks keep the selector working even when the external
      // country-metadata request is blocked, slow, or unavailable.
      const languageByNumericId = new Map([
        // Spanish-speaking countries
        ['032', 'es'], ['068', 'es'], ['170', 'es'], ['188', 'es'], ['214', 'es'],
        ['222', 'es'], ['320', 'es'], ['340', 'es'], ['484', 'es'], ['504', 'es'],
        ['558', 'es'], ['591', 'es'], ['600', 'es'], ['604', 'es'], ['620', 'es'],
        ['630', 'es'], ['724', 'es'], ['740', 'es'], ['858', 'es'], ['862', 'es'],
        ['152', 'es'], ['706', 'en'], ['136', 'en'],
        // Portuguese-speaking countries
        ['076', 'pt'], ['024', 'pt'], ['132', 'pt'], ['226', 'pt'], ['376', 'pt'],
        ['396', 'pt'], ['404', 'en'], ['508', 'pt'], ['554', 'en'], ['678', 'pt'],
              ]);

      function languageGroup(info) {
        const values = (info.languages || []).map(v => String(v).toLowerCase());
        if (values.some(v => /spanish|español|espanol/.test(v))) return 'es';
        if (values.some(v => /portuguese|português|portugues/.test(v))) return 'pt';
        if (values.some(v => /english|inglés|ingles/.test(v))) return 'en';

        // TopoJSON numeric IDs may arrive as 32 instead of 032.
        const rawId = String(info.numericId || '');
        const normalizedId = rawId.padStart(3, '0');
        return languageByNumericId.get(rawId)
          || languageByNumericId.get(normalizedId)
          || 'en';
      }

      async function loadMetadata() {
        try {
          const response = await fetch('https://restcountries.com/v3.1/all?fields=name,cca2,ccn3,capital,region,subregion,languages,timezones,flags');
          if (!response.ok) throw new Error(`Metadata HTTP ${response.status}`);
          const data = await response.json();
          data.forEach(country => {
            if (!country.ccn3) return;
            const info = {
              name: country.name?.common || fallbackNames[country.ccn3] || 'País',
              cca2: country.cca2 || '',
              languages: country.languages ? Object.values(country.languages) : [],
              timezones: country.timezones || [],
              timezoneOffsetMinutes: getReferenceOffset(country.timezones),
              region: country.region || '',
              subregion: country.subregion || '',
              capital: country.capital?.[0] || ''
            };
            metadataByNumericId.set(String(Number(country.ccn3)), info);
            metadataByNumericId.set(String(country.ccn3), info);
          });
        } catch (error) {
          console.warn('No se pudo cargar la metadata de países:', error);
        }
      }

      function resize() {
        const rect = mapShell.getBoundingClientRect();
        const width = Math.max(320, rect.width);
        const height = Math.max(280, rect.height);
        svg.attr('viewBox', `0 0 ${width} ${height}`);

        projection = d3.geoNaturalEarth1();
        projection.fitExtent([[24, 34], [width - 24, height - 26]], { type: 'Sphere' });
        path = d3.geoPath(projection);

        svg.select('.sphere').attr('d', path({ type: 'Sphere' }));
        svg.select('.graticule').attr('d', path(d3.geoGraticule10()));
        svg.selectAll('.country-path').attr('d', d => path(d));
      }

      function resolveInfo(d) {
        const id = String(Number(d.id));
        const info = metadataByNumericId.get(id) || metadataByNumericId.get(String(d.id));
        if (info) return { ...info, numericId: id };
        return {
          numericId: id,
          name: d.properties?.name || fallbackNames[d.id] || 'País',
          cca2: '',
          languages: [],
          timezones: ['UTC-03:00'],
          timezoneOffsetMinutes: -180,
          region: '',
          subregion: '',
          capital: ''
        };
      }

      function sendCountryToParent(info) {
        const payload = {
          type: 'oliv-country-selected',
          countryName: info.name,
          countryCode: info.cca2,
          timezoneOffsetMinutes: info.timezoneOffsetMinutes,
          timezoneLabel: info.timezones?.[0] || 'UTC-03:00',
          officialLanguages: info.languages || [],
          languageGroup: languageGroup(info) || 'en'
        };
        window.parent.postMessage(payload, '*');
      }

      function selectCountry(pathNode, d) {
        const info = resolveInfo(d);
        if (selectedPath) selectedPath.classed('selected', false).classed('active', false);
        selectedPath = d3.select(pathNode);
        selectedPath.classed('selected', true).classed('active', true);
        mapStatus.textContent = info.name;
        sendCountryToParent(info);
      }

      function showTooltip(event, d) {
        const info = resolveInfo(d);
        tooltipName.textContent = info.name;
        tooltip.classList.add('show');
        tooltip.setAttribute('aria-hidden', 'false');
        tooltip.style.left = `${event.clientX}px`;
        tooltip.style.top = `${event.clientY}px`;
      }

      function hideTooltip() {
        tooltip.classList.remove('show');
        tooltip.setAttribute('aria-hidden', 'true');
      }

      async function renderMap() {
        try {
          const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
          if (!response.ok) throw new Error(`Map HTTP ${response.status}`);
          const world = await response.json();
          countries = topojson.feature(world, world.objects.countries).features;

          svg.append('path').datum({ type: 'Sphere' }).attr('class', 'sphere');
          svg.append('path').datum(d3.geoGraticule10()).attr('class', 'graticule');

          svg.selectAll('.country-path')
            .data(countries)
            .join('path')
            .attr('class', 'country-path')
            .attr('tabindex', 0)
            .attr('role', 'button')
            .attr('aria-label', d => resolveInfo(d).name)
            .attr('d', d => path(d))
            .on('mouseenter', function(event, d) {
              d3.select(this).classed('active', true);
              showTooltip(event, d);
            })
            .on('mousemove', showTooltip)
            .on('mouseleave', function() {
              if (this !== selectedPath?.node()) d3.select(this).classed('active', false);
              hideTooltip();
            })
            .on('click', function(event, d) {
              selectCountry(this, d);
            })
            .on('focus', function(event, d) {
              d3.select(this).classed('active', true);
              showTooltip(event, d);
            })
            .on('blur', function() {
              if (this !== selectedPath?.node()) d3.select(this).classed('active', false);
              hideTooltip();
            })
            .on('keydown', function(event, d) {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                selectCountry(this, d);
              }
            });

          resize();
          loading.classList.add('hidden');
        } catch (error) {
          console.error(error);
          loading.textContent = 'Error · No se pudo cargar el mapa.';
        }
      }

      window.addEventListener('resize', resize);
      window.addEventListener('message', event => {
        if (event.data?.type === 'oliv-map-reset') {
          if (selectedPath) selectedPath.classed('selected', false).classed('active', false);
          selectedPath = null;
          mapStatus.textContent = 'Seleccioná un país';
        }
      });

      Promise.all([loadMetadata(), renderMap()]);
    })();
  </script>
</body>
</html>
